# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.{androidX}=true

# Kotlin
kotlin.code.style=official

# Tell the mpv JNI wrapper where the prebuilt libmpv + headers live.
# After building libmpv (audio-only) with the mpv-android buildscripts, copy:
#   libmpv.so        -> app/src/main/prebuilt/<abi>/libmpv.so
#   mpv headers      -> app/src/main/prebuilt/include/
# If you used a different layout, point this at the directory that contains
# `include/` and `<abi>/libmpv.so`.
mpv.dir=app/src/main/prebuilt
